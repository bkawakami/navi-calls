<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Navi | Assistente IA</title>
  <style>
    :root { --bg: #0b1020; --fg: #e5e7eb; --muted: #94a3b8; --accent: #6366f1; --accent2: #22d3ee; --ok: #34d399; --warn: #fbbf24; --err: #f87171; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
    .stage { position: relative; width: 100vw; height: 100vh; display: grid; grid-template-rows: 1fr auto; background: radial-gradient(1200px 600px at 50% 20%, #1e1b4b 0%, var(--bg) 60%); }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; }
    .orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #a5f3fc, var(--accent) 55%, #1e1b4b); box-shadow: 0 0 60px rgba(99,102,241,.55); transition: transform .3s ease, box-shadow .3s ease; }
    .orb.listening { animation: breathe 3.2s ease-in-out infinite; }
    .orb.thinking { animation: spin 1.1s linear infinite; background: conic-gradient(from 0deg, var(--accent2), var(--accent), #1e1b4b, var(--accent2)); }
    .orb.speaking { animation: talk .55s ease-in-out infinite; box-shadow: 0 0 90px rgba(34,211,238,.7); }
    .orb.offline { filter: grayscale(.9); opacity: .6; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes talk { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .name { font-size: 54px; font-weight: 700; letter-spacing: -.02em; }
    .name span { color: var(--muted); font-weight: 400; }
    .status { display: inline-flex; align-items: center; gap: 12px; font-size: 28px; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
    .dot.listening { background: var(--ok); } .dot.thinking, .dot.speaking { background: var(--accent2); } .dot.error { background: var(--err); } .dot.connecting { background: var(--warn); }
    .caption { max-width: 1000px; text-align: center; font-size: 26px; line-height: 1.35; color: var(--fg); min-height: 70px; }
    .caption.muted { color: var(--muted); font-size: 22px; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; font-size: 18px; color: var(--muted); border-top: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.25); }
    .hint b { color: var(--fg); }
    #log { position: absolute; right: 12px; top: 12px; width: 420px; max-height: 50vh; overflow: auto; font: 12px/1.35 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.7); padding: 8px; border-radius: 8px; display: none; white-space: pre-wrap; }
    body.debug #log { display: block; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="center">
      <div id="orb" class="orb offline"></div>
      <div class="name">Navi <span>| Assistente IA</span></div>
      <div class="status"><span id="dot" class="dot"></span><span id="status">Conectando…</span></div>
      <div id="caption" class="caption muted">Diga “Navi, …” para me chamar. Eu ouço em silêncio e respondo quando chamada.</div>
    </div>
    <div class="bar">
      <div class="hint">“<b>Navi</b>, lembre-se de …” · “<b>Navi</b>, o que você acha …?” · “<b>Navi</b>, resume o que decidimos”</div>
      <div id="meta">{{ meeting.title or 'Reunião' }}</div>
    </div>
  </div>
  <pre id="log"></pre>
  <audio id="remote" autoplay playsinline></audio>
  <script>
    window.NAVI = {
      meetingId: {{ meeting.id|tojson }},
      token: {{ token|tojson }},
      apiBase: {{ ("/api/assistant/" ~ meeting.id)|tojson }},
      debug: new URLSearchParams(location.search).has('debug'),
      transport: {{ transport|tojson }},
    };
  </script>
  <script src="/static/js/assistant.js"></script>
</body>
</html>
